name: Deploy to AWS (dev)

# Builds all five images, pushes them to ECR, then forces a new ECS deployment.
#
# Required GitHub config (Settings -> Secrets and variables -> Actions):
#   Secrets:
#     AWS_ROLE_ARN          IAM role to assume via OIDC (recommended over keys)
#   Variables:
#     AWS_REGION            e.g. us-east-1
#     ECR_REGISTRY          <account-id>.dkr.ecr.<region>.amazonaws.com
#     ECS_CLUSTER           ECS cluster name (Terraform output: ecs_cluster_name, e.g. homiq-dev)
#     NEXT_PUBLIC_API_URL   public app URL (Terraform output: app_url) — baked into the frontend bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  id-token: write # for OIDC role assumption
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: frontend
            context: apps/frontend
            dockerfile: apps/frontend/Dockerfile
          - service: main
            context: apps/backend
            dockerfile: apps/backend/apps/main/Dockerfile
          - service: auth
            context: apps/backend
            dockerfile: apps/backend/apps/auth/Dockerfile
          - service: user
            context: apps/backend
            dockerfile: apps/backend/apps/user/Dockerfile
          - service: email
            context: apps/backend
            dockerfile: apps/backend/apps/email/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # Only the frontend consumes this; ignored by the backend builds.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ vars.ECR_REGISTRY }}/homiq/${{ matrix.service }}:latest
            ${{ vars.ECR_REGISTRY }}/homiq/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Force new ECS deployments
        run: |
          for svc in frontend main auth user email; do
            echo "Redeploying $svc..."
            aws ecs update-service \
              --cluster "${{ vars.ECS_CLUSTER }}" \
              --service "$svc" \
              --force-new-deployment \
              --no-cli-pager >/dev/null
          done

      - name: Wait for services to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services frontend main auth user email
