services:
  mongodb:
    container_name: app-mongodb
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # S3-compatible object storage for local development (production uses AWS
  # S3 — same code path, different STORAGE_* env vars on main-service).
  # API on :9000, web console on :9001 (minioadmin / minioadmin).
  minio:
    container_name: app-minio
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot job: creates the media bucket on first boot, then exits.
  minio-init:
    container_name: app-minio-init
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/property-manager-media &&
      echo 'MinIO bucket ready'
      "
    networks:
      - app-network

  redis:
    container_name: app-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    container_name: app-user-service
    build:
      context: ./apps/backend
      dockerfile: apps/user/Dockerfile.dev
    env_file:
      - ./apps/backend/.env
    environment:
      USER_SERVICE_HOST: 0.0.0.0
      USER_SERVICE_PORT: 3002
      MONGO_URI: mongodb://mongodb:27017/homiq
    volumes:
      - ./apps/backend:/usr/src/app
      - /usr/src/app/node_modules
    develop:
      watch:
        - action: sync
          path: ./apps/backend
          target: /usr/src/app
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: ./apps/backend/apps/user/
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network

  auth-service:
    container_name: app-auth-service
    build:
      context: ./apps/backend
      dockerfile: apps/auth/Dockerfile.dev
    env_file:
      - ./apps/backend/.env
    environment:
      AUTH_SERVICE_HOST: 0.0.0.0
      AUTH_SERVICE_PORT: 3001
    volumes:
      - ./apps/backend:/usr/src/app
      - /usr/src/app/node_modules
    develop:
      watch:
        - action: sync
          path: ./apps/backend
          target: /usr/src/app
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: ./apps/backend/apps/auth/
    depends_on:
      - user-service
    networks:
      - app-network

  billing-service:
    container_name: app-billing-service
    build:
      context: ./apps/backend
      dockerfile: apps/billing/Dockerfile.dev
    env_file:
      - ./apps/backend/.env
    environment:
      BILLING_SERVICE_HOST: 0.0.0.0
      BILLING_SERVICE_PORT: 3004
      MONGO_URI: mongodb://mongodb:27017/homiq
      BILLING_PAYMENT_PROVIDER: mock
      BILLING_DEFAULT_PLAN: free
    volumes:
      - ./apps/backend:/usr/src/app
      - /usr/src/app/node_modules
    develop:
      watch:
        - action: sync
          path: ./apps/backend
          target: /usr/src/app
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: ./apps/backend/apps/billing/
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network

  email-service:
    container_name: app-email-service
    build:
      context: ./apps/backend
      dockerfile: apps/email/Dockerfile.dev
    env_file:
      - ./apps/backend/.env
    environment:
      EMAIL_SERVICE_HOST: 0.0.0.0
      EMAIL_SERVICE_PORT: 3003
    volumes:
      - ./apps/backend:/usr/src/app
      - /usr/src/app/node_modules
    develop:
      watch:
        - action: sync
          path: ./apps/backend
          target: /usr/src/app
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: ./apps/backend/apps/email/
    networks:
      - app-network

  main-service:
    container_name: app-main-service
    build:
      context: ./apps/backend
      dockerfile: apps/main/Dockerfile.dev
    ports:
      - "3000:3000"
    env_file:
      - ./apps/backend/.env
    environment:
      PORT: 3000
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: 3001
      USER_SERVICE_HOST: user-service
      USER_SERVICE_PORT: 3002
      EMAIL_SERVICE_HOST: email-service
      EMAIL_SERVICE_PORT: 3003
      BILLING_SERVICE_HOST: billing-service
      BILLING_SERVICE_PORT: 3004
      MONGO_URI: mongodb://mongodb:27017/homiq
      FRONTEND_URL: http://localhost:4000
      REDIS_URL: redis://redis:6379
      # Object storage: MinIO inside the compose network. The service talks to
      # minio:9000 (Docker DNS) while URLs handed to the browser are signed
      # against the host mapping localhost:9000.
      STORAGE_PROVIDER: minio
      STORAGE_BUCKET: property-manager-media
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY_ID: minioadmin
      STORAGE_SECRET_ACCESS_KEY: minioadmin
      STORAGE_URL_MODE: signed
    volumes:
      - ./apps/backend:/usr/src/app
      - /usr/src/app/node_modules
    develop:
      watch:
        - action: sync
          path: ./apps/backend
          target: /usr/src/app
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: ./apps/backend/apps/main/
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      email-service:
        condition: service_started
      billing-service:
        condition: service_started
    networks:
      - app-network

  frontend:
    container_name: app-frontend
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.dev
    ports:
      - "4000:4000"
    env_file:
      - ./apps/frontend/.env
    environment:
      # Server-side API calls use container DNS name
      NEST_BACKEND_PUBLIC_API_URL: http://main-service:3000
      # Enable polling for hot reload with Docker bind mounts
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    develop:
      watch:
        - action: sync
          path: ./apps/frontend
          target: /app
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: ./apps/frontend/package.json
    depends_on:
      - main-service
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data:
  minio_data:
